<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Adil Wazir M5 PRO - VIP Edition</title>
<style>
:root {
    --bg-main: #060913; --bg-card: #0f1626; --bg-metric: #0a0e1a;
    --border-color: #1f2c45; --text-primary: #edf4ff; --text-muted: #8fa1bd;
    --color-accent: #00d4ff; --color-buy: #00c076; --color-sell: #ff3344; --color-wait: #4a5568;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
    background: var(--bg-main); color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    padding: 16px; max-width: 500px; margin: 0 auto; padding-bottom: 30px;
}
.header, .card {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
}
.header { text-align: center; }
h1 { font-size: 18px; color: var(--color-accent); font-weight: 700; letter-spacing: 0.5px; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab {
    flex: 1; padding: 12px; border-radius: 10px; background: #151e30; border: 1px solid var(--border-color);
    color: var(--text-muted); font-weight: bold; font-size: 13px; cursor: pointer; text-align: center;
}
.tab.active { background: #087eac; color: #fff; border-color: #00d4ff; }
.price { font-size: 26px; font-family: monospace; font-weight: bold; margin: 12px 0; }
.signal { display: inline-block; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 13px; background: var(--color-wait); color: #fff; text-transform: uppercase; }
.signal.buy { background: var(--color-buy); }
.signal.sell { background: var(--color-sell); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.metric { padding: 12px; background: var(--bg-metric); border-radius: 10px; border: 1px solid rgba(255,255,255,0.02); }
.metric small { color: var(--text-muted); font-size: 11px; display: block; margin-bottom: 4px; text-transform: uppercase; }
.metric strong { font-size: 14px; font-family: monospace; color: var(--text-primary); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #e7a83c; margin-right: 6px; }
.dot.active { background: #00e59a; box-shadow: 0 0 8px #00e59a; }
</style>
</head>
<body>

<div class="header">
    <h1>💎 ADIL WAZIR M5 VIP</h1>
    <small style="display: flex; align-items: center; justify-content: center; margin-top: 4px;">
        <span id="dot" class="dot"></span><span id="connection" style="color: var(--text-muted);">Connecting to Cloud Server...</span>
    </small>
</div>

<div class="tabs">
    <div class="tab active" id="tab-btc" onclick="switchPair('BTCUSDT')">BTC</div>
    <div class="tab" id="tab-paxg" onclick="switchPair('PAXGUSDT')">GOLD</div>
    <div class="tab" id="tab-eur" onclick="switchPair('EURUSDT')">EURUSD</div>
</div>

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div><b id="pairName">₿ BTCUSDT</b><div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Cloud Stream · M5 Matrix</div></div>
        <span id="signal" class="signal">WAIT</span>
    </div>
    <div class="price" id="candlePrice">--</div>
    
    <div class="grid">
        <div class="metric"><small>Wilder RSI (14)</small><strong id="rsi">--</strong></div>
        <div class="metric"><small>EMA 20 / 50</small><strong id="ema">--</strong></div>
        <div class="metric"><small>Reasoning Engine</small><strong id="reason" style="font-size: 12px; font-weight: normal; color: var(--text-muted);">Syncing...</strong></div>
        <div class="metric"><small>Server Time</small><strong id="serverTime">--</strong></div>
    </div>
</div>

<script>
'use strict';
// --- 💎 SYSTEM CONFIGURATION: Apna Render Server URL Yahan Paste Karein ---
// Example format: https://onrender.com
const SERVER_URL = 'https://onrender.com'; 

let currentPair = 'BTCUSDT';
const $ = id => document.getElementById(id);

function switchPair(p) {
    currentPair = p;
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    let cleanId = p.toLowerCase().replace('usdt', '');
    if ($('tab-' + cleanId)) $('tab-' + cleanId).classList.add('active');
    $('pairName').textContent = p === 'EURUSDT' ? '€$ EURUSD' : p === 'PAXGUSDT' ? 'Au GOLD' : '₿ BTCUSDT';
    streamCloudData();
}

async function streamCloudData() {
    try {
        const response = await fetch(SERVER_URL);
        if(!response.ok) throw new Error('Cloud server lag');
        const json = await response.json();
        
        const activeData = json.data[currentPair];
        if(!activeData) throw new Error('No asset data allocation');
        
        let dec = (currentPair === 'EURUSDT') ? 5 : 2;
        let prefix = (currentPair === 'EURUSDT') ? '' : '$';
        
        $('candlePrice').textContent = prefix + parseFloat(activeData.price).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
        $('rsi').textContent = activeData.rsi;
        $('ema').textContent = activeData.ema;
        $('reason').textContent = activeData.reason;
        
        let sig = activeData.signal;
        $('signal').textContent = sig;
        $('signal').className = 'signal ' + sig.toLowerCase();
        
        $('dot').className = 'dot active';
        $('connection').textContent = 'CLOUD NODE ACTIVE';
        $('serverTime').textContent = new Date(activeData.timestamp).toLocaleTimeString();

    } catch (e) {
        $('dot').className = 'dot';
        $('connection').textContent = 'SERVER SYNCING...';
        console.log(e.message);
    }
}

setInterval(streamCloudData, 3000);
streamCloudData();
</script>
</body>
</html>
