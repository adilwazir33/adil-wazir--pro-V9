<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADIL WAZIR V9 PRO - LIVE REAL</title>
<style>
:root{--bg:#0b0e11;--panel:#151a21;--card:#1c222e;--border:#2a3441;--text:#e8edf3;--muted:#8b98a8;--green:#0ecb81;--red:#f6465d;--gold:#f0b90b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 monospace;padding-bottom:30px}
header,.top{padding:12px;background:var(--panel);border-bottom:1px solid var(--border)}.top{font-size:11px;color:var(--gold)}
header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.controls{padding:12px;display:flex;gap:8px;flex-wrap:wrap}
button,select{padding:10px;border-radius:7px;border:1px solid var(--border);background:var(--panel);color:var(--text)}
button{background:var(--gold);color:#111;font-weight:bold}
.status,.card{margin:12px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.card.top{border-left:4px solid var(--gold)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-size:25px;font-weight:bold;margin:12px 0}
.badge{padding:6px 10px;border-radius:6px;font-weight:bold;font-size:11px}
.BUY{background:var(--green);color:#000}.SELL{background:var(--red);color:#fff}.WAIT{border:1px solid var(--border);color:var(--muted)}
.muted{font-size:11px;color:var(--muted)}
.metrics,.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.levels{grid-template-columns:repeat(4,minmax(0,1fr))}
.metric,.lv{background:var(--bg);padding:8px;border:1px solid var(--border);border-radius:6px}
.metric span,.lv span{display:block;color:var(--muted);font-size:10px}.metric b,.lv b{font-size:12px}
.reason{font-size:11px;color:#bdc7d4;line-height:1.7;padding:9px;background:var(--bg);margin-top:10px;border-radius:6px}
</style>
</head>
<body>
<div class="top" id="ticker">V9 PRO LIVE · REAL BINANCE DATA ONLY · NO FAKE</div>
<header><b>ADIL WAZIR <span style="color:#f0b90b">V9 PRO LIVE</span> • BTCUSD.r</b><span class="muted" id="updated">Connecting...</span></header>
<div class="controls">
<select id="interval"><option value="15m">15m</option><option value="5m">5m</option><option value="1h">1h</option><option value="4h">4h</option></select>
<button id="refresh">Refresh Real Data</button>
</div>
<div class="status" id="status">Fetching real Binance candles... LIVE CODING ACTIVE</div>
<div id="grid"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let busy=false;
function fmt(n,d=2){return Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"--";}
function ema(values,period){if(values.length<period)return null;let e=values.slice(0,period).reduce((a,b)=>a+b,0)/period;const k=2/(period+1);for(let i=period;i<values.length;i++) e=values[i]*k+e*(1-k);return e;}
function rsi(values,period=14){if(values.length<period+1)return null;let gains=0,losses=0;for(let i=1;i<=period;i++){const d=values[i]-values[i-1]; if(d>0)gains+=d;else losses-=d;}let ag=gains/period,al=losses/period;for(let i=period+1;i<values.length;i++){const d=values[i]-values[i-1]; ag=(ag*(period-1)+Math.max(d,0))/period; al=(al*(period-1)+Math.max(-d,0))/period;}if(al===0)return ag===0?50:100;return 100-100/(1+ag/al);}
function atr(bars,period=14){if(bars.length<period+1)return null;const tr=[];for(let i=1;i<bars.length;i++){const b=bars[i],p=bars[i-1].close;tr.push(Math.max(b.high-b.low,Math.abs(b.high-p),Math.abs(b.low-p)));}let v=tr.slice(0,period).reduce((a,b)=>a+b,0)/period;for(let i=period;i<tr.length;i++) v=(v*(period-1)+tr[i])/period;return v;}
async function fetchCandles(interval){
const bases=["https://data-api.binance.vision","https://api.binance.com","https://api1.binance.com"];
let lastError;
for(const base of bases){
try{
const c=new AbortController();const t=setTimeout(()=>c.abort(),12000);
let res;try{res=await fetch(base+"/api/v3/klines?symbol=BTCUSDT&interval="+encodeURIComponent(interval)+"&limit=100",{cache:"no-store",signal:c.signal});}finally{clearTimeout(t)}
if(!res.ok)throw Error("HTTP "+res.status);
const data=await res.json();
if(!Array.isArray(data)) throw Error(data.msg||"Invalid response");
if(data.length<51) throw Error("Only "+data.length+" candles");
const now=Date.now();
const all=data.map(k=>({openTime:Number(k[0]),open:Number(k[1]),high:Number(k[2]),low:Number(k[3]),close:Number(k[4]),volume:Number(k[5]),closeTime:Number(k[6])}));
const closed=all.filter(b=>b.closeTime<now);
if(closed.length<51) throw Error("Insufficient completed: "+closed.length);
return {bars:closed,source:new URL(base).host,count:data.length};
}catch(e){lastError=e; continue;}
}
throw Error(lastError?.message||"API unavailable");
}
function analyze(bars,interval){
const c=bars.map(b=>b.close);
const e20=ema(c,20),e50=ema(c,50),rv=rsi(c),av=atr(bars);
const last=bars[bars.length-1];
if([e20,e50,rv,av,last.close].some(x=>!Number.isFinite(x))||av<=0) throw Error("Indicator failed");
const atrPct=av/last.close*100;
const vol=bars.slice(-20,-1).map(b=>b.volume);const avgVol=vol.reduce((a,b)=>a+b,0)/vol.length;const volSpike=avgVol>0?(last.volume/avgVol-1)*100:0;
const bull=e20>e50&&last.close>e20;const bear=e20<e50&&last.close<e20;
const buyRsi=rv>=50&&rv<=68;const sellRsi=rv>=32&&rv<=50;
const volOK=volSpike>=5;const atrOK=atrPct<=2.5;
const buyScore=[bull,buyRsi,atrOK,volOK].filter(Boolean).length;
const sellScore=[bear,sellRsi,atrOK,volOK].filter(Boolean).length;
let type="WAIT",score=Math.max(buyScore,sellScore);
if(bull&&buyRsi&&buyScore>=3){type="BUY";score=buyScore}
else if(bear&&sellRsi&&sellScore>=3){type="SELL";score=sellScore}
const entry=last.close;
const sl=type==="BUY"?entry-1.5*av:type==="SELL"?entry+1.5*av:null;
const tp1=type==="BUY"?entry+1.5*av:type==="SELL"?entry-1.5*av:null;
const tp2=type==="BUY"?entry+2.5*av:type==="SELL"?entry-2.5*av:null;
return {interval,price:entry,closeTime:last.closeTime,rv,e20,e50,av,atrPct,volSpike,type,score,entry,sl,tp1,tp2,
reasons:["EMA: "+(bull?"BULLISH":bear?"BEARISH":"NOT ALIGNED"),"RSI "+fmt(rv,1)+"; BUY 50-68 / SELL 32-50","ATR "+fmt(atrPct,2)+"%; "+(atrOK?"OK":"High"),"Volume "+fmt(volSpike,1)+"%; "+(volOK?"Spike":"No spike")]};
}
function render(a,source,count){
const level=n=>n===null?"--":fmt(n,2);
$("grid").innerHTML=`<article class="card ${a.type!=="WAIT"?"top":""}"><div class="row"><div><b>BTCUSD.r</b> (BTCUSDT) <div class="muted">Binance Spot · ${a.interval} · ${count} completed · LIVE APP</div></div><span class="badge ${a.type}">${a.type} · ${a.score}/4</span></div><div class="price">$${fmt(a.price,2)} <span class="muted">USDT</span></div><div class="muted">Last completed: ${new Date(a.closeTime).toLocaleString()}</div><div class="metrics"><div class="metric"><span>RSI 14</span><b>${fmt(a.rv,2)}</b></div><div class="metric"><span>EMA 20</span><b>${fmt(a.e20,2)}</b></div><div class="metric"><span>EMA 50</span><b>${fmt(a.e50,2)}</b></div><div class="metric"><span>ATR 14</span><b>${fmt(a.av,2)}</b></div><div class="metric"><span>ATR %</span><b>${fmt(a.atrPct,3)}%</b></div><div class="metric"><span>Vol Chg</span><b>${fmt(a.volSpike,1)}%</b></div></div><div class="levels"><div class="lv"><span>ENTRY</span><b>${level(a.entry)}</b></div><div class="lv"><span>STOP-LOSS</span><b>${level(a.sl)}</b></div><div class="lv"><span>TP1 (1.5 ATR)</span><b>${level(a.tp1)}</b></div><div class="lv"><span>TP2 (2.5 ATR)</span><b>${level(a.tp2)}</b></div></div><div class="reason"><b>Rules (Completed candles only):</b><br>${a.reasons.map(s=>"• "+s).join("<br>")}<br><br>✅ Coding APP mai LIVE ho rahi hai - Ye code GitHub se live chal raha hai!</div><div class="muted">Source: ${source} · No fake data · GitHub: adil-wazir--pro-V9</div></article>`;
}
async function refresh(){
if(busy)return;busy=true;$("refresh").disabled=true;$("status").textContent="Fetching 100 candles... LIVE";$("grid").innerHTML="";
try{
const interval=$("interval").value;
const r=await fetchCandles(interval);
const a=analyze(r.bars,interval);
render(a,r.source,r.bars.length);
$("status").textContent="DATA OK · "+r.count+" candles · completed only · LIVE CODING ACTIVE";
$("ticker").textContent="V9 PRO LIVE · BINANCE REAL · BTCUSD.r "+interval+" · CODING APP MAI LIVE";
$("updated").textContent="Updated "+new Date().toLocaleTimeString();
}catch(e){
$("grid").innerHTML=`<article class="card"><b>BTCUSD.r</b> <span class="badge WAIT">DATA UNAVAILABLE</span><div class="reason" style="color:#f6465d">${String(e.message)}<br>No fake price - per Rule 6</div></article>`;
$("status").textContent="API ERROR · No fake signal";$("ticker").textContent="DATA UNAVAILABLE · NO FAKE PRICE";$("updated").textContent="Attempt "+new Date().toLocaleTimeString();
}finally{busy=false;$("refresh").disabled=false;}
}
$("refresh").addEventListener("click",refresh);
$("interval").addEventListener("change",refresh);
refresh();setInterval(refresh,30000);
</script>
</body>
</html>
