 <script>
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => Number(n).toLocaleString("en-US", {
  minimumFractionDigits:d, maximumFractionDigits:d
});

function tick(){
  const t = new Date().toLocaleString("en-GB", {
    timeZone:"Asia/Dubai", hour12:true
  });
  $("clock").textContent = t;
  $("footTime").textContent = t;
}
tick();
setInterval(tick,1000);

async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw Error("API HTTP "+r.status);
  return r.json();
}

function ema(v,p){
  let x=v[0], k=2/(p+1);
  for(let i=1;i<v.length;i++) x=v[i]*k+x*(1-k);
  return x;
}

function rsi(v,per=14){
  let g=0,l=0;
  for(let i=1;i<=per;i++){
    const d=v[i]-v[i-1];
    if(d>0) g+=d; else l-=d;
  }
  g/=per; l/=per;
  for(let i=per+1;i<v.length;i++){
    const d=v[i]-v[i-1];
    g=(g*(per-1)+Math.max(d,0))/per;
    l=(l*(per-1)+Math.max(-d,0))/per;
  }
  if(l===0) return g===0?50:100;
  return 100-100/(1+g/l);
}

function atr(c,per=14){
  const tr=[];
  for(let i=1;i<c.length;i++){
    const cur=c[i], prev=c[i-1];
    tr.push(Math.max(
      cur.h-cur.l,
      Math.abs(cur.h-prev.c),
      Math.abs(cur.l-prev.c)
    ));
  }
  let a=tr.slice(0,per).reduce((s,x)=>s+x,0)/per;
  for(let i=per;i<tr.length;i++)
    a=(a*(per-1)+tr[i])/per;
  return a;
}

/* Strict filter: BUY/SELL only at 4/4.
   Uses completed candles only. */
function analyze(candles){
  if(candles.length<60) throw Error("Need 60+ closed candles");

  const closes=candles.map(x=>x.c);
  const last=closes.at(-1), prev=closes.at(-2);
  const e20=ema(closes,20), e50=ema(closes,50);
  const r=rsi(closes), a=atr(candles);

  if(!Number.isFinite(a)||a<=0||!Number.isFinite(r))
    throw Error("Indicator data invalid");

  const buyChecks=[
    last>e20,
    e20>e50,
    r>=52&&r<=68,
    last>prev
  ];

  const sellChecks=[
    last<e20,
    e20<e50,
    r>=32&&r<=48,
    last<prev
  ];

  const buy=buyChecks.filter(Boolean).length;
  const sell=sellChecks.filter(Boolean).length;

  let dir="WAIT", score=Math.max(buy,sell);
  let sl=null,tp=null,reason="No fully confirmed setup";

  if(buy===4){
    dir="BUY";
    sl=last-a;
    tp=last+2*a;
    reason="BUY confirmed: 4/4 conditions";
  } else if(sell===4){
    dir="SELL";
    sl=last+a;
    tp=last-2*a;
    reason="SELL confirmed: 4/4 conditions";
  } else {
    reason="WAIT: BUY "+buy+"/4, SELL "+sell+"/4";
  }

  return {
    last,e20,e50,r,a,dir,reason,
    score,entry:last,sl,tp,
    trend:e20>e50?"Bullish":e20<e50?"Bearish":"Mixed"
  };
}

/* Only the latest fully closed 15m candles are analyzed. */
function closedCandles(raw){
  const now=Date.now();
  return raw.filter(k=>Number(k[6])<now).map(k=>({
    h:+k[2],l:+k[3],c:+k[4]
  }));
}

/* Use a neutral estimated spread only for display.
   This is NOT a Lirunex bid/ask quote. */
function setBidAsk(pref,price,pct,day,d){
  const spread=price*pct/100;
  $(pref+"Bid").textContent=fmt(price-spread/2,d);
  $(pref+"Ask").textContent=fmt(price+spread/2,d);
  const el=$(pref+"Day");
  el.textContent=(day>=0?"+":"")+fmt(day,2)+"%";
  el.className="day "+(day>=0?"up":"down");
}

function promoteCard(cardId,score,dir){
  const card=$(cardId);
  card.classList.remove("top-pair");
  card.style.order="10";
  if(dir==="BUY"||dir==="SELL"){
    card.style.order="1";
    card.classList.add("top-pair");
  }
}

/* Prevent old successful signals remaining visible after API errors. */
function offline(pref,e){
  const s=$(pref+"Signal");
  s.textContent="OFFLINE";
  s.className="signal offline";
  $(pref+"Status").textContent="No current data: "+e.message;
  $(pref+"Reason").textContent="Signal unavailable. Check data connection.";
  $(pref+"Price").textContent="--";
  $(pref+"Bid").textContent="--";
  $(pref+"Ask").textContent="--";
  $(pref+"Day").textContent="";
  if($(pref+"Score")) $(pref+"Score").textContent="--";
  if($(pref+"Rsi")) $(pref+"Rsi").textContent="--";
  if($(pref+"Ema")) $(pref+"Ema").textContent="--";
  if($(pref+"Trend")) $(pref+"Trend").textContent="--";
  if($(pref+"Entry")) $(pref+"Entry").textContent="--";
  if($(pref+"SL")) $(pref+"SL").textContent="--";
  if($(pref+"TP")) $(pref+"TP").textContent="--";
  promoteCard("card-"+pref,0,"WAIT");
}

function renderCrypto(pref,x,tk,d){
  $(pref+"Price").textContent="$"+fmt(x.last,d);
  setBidAsk(pref,x.last,pref==="btc"?0.02:0.03,
    +tk.priceChangePercent,d);

  const s=$(pref+"Signal");
  s.textContent=x.dir;
  s.className="signal "+(x.dir==="BUY"?"buy":
    x.dir==="SELL"?"sell":"");

  $(pref+"Score").textContent=x.score+"/4";
  $(pref+"Rsi").textContent=fmt(x.r,1);
  $(pref+"Ema").textContent=fmt(x.e20,d)+"/"+fmt(x.e50,d);
  $(pref+"Trend").textContent=x.trend;
  $(pref+"Entry").textContent=fmt(x.entry,d);
  $(pref+"SL").textContent=x.sl===null?"--":fmt(x.sl,d);
  $(pref+"TP").textContent=x.tp===null?"--":fmt(x.tp,d);
  $(pref+"Reason").textContent=x.reason;
  $(pref+"Status").textContent=
    "Binance • Closed 15m candles • Updated "+new Date().toLocaleTimeString();

  promoteCard("card-"+pref,x.score,x.dir);
}

async function loadCrypto(pref,symbol,d){
  try{
    const base="https://api.binance.com/api/v3/";
    const [tk,kl]=await Promise.all([
      getJSON(base+"ticker/24hr?symbol="+symbol),
      getJSON(base+"klines?symbol="+symbol+"&interval=15m&limit=150")
    ]);
    const candles=closedCandles(kl);
    const x=analyze(candles);
    renderCrypto(pref,x,tk,d);
  }catch(e){
    offline(pref,e);
  }
}

async function loadBTC(){
  await loadCrypto("btc","BTCUSDT",2);
}
async function loadGold(){
  await loadCrypto("gold","PAXGUSDT",2);
}

async function loadEUR(){
  try{
    const end=new Date(), start=new Date(Date.now()-180*86400000);
    const d=v=>v.toISOString().slice(0,10);
    const j=await getJSON(
      "https://api.frankfurter.dev/v1/"+d(start)+".."+d(end)+
      "?base=EUR&symbols=USD"
    );
    const ent=Object.entries(j.rates).sort((a,b)=>a[0].localeCompare(b[0]));
    if(ent.length<2) throw Error("Insufficient reference data");
    const last=+ent.at(-1)[1].USD,prev=+ent.at(-2)[1].USD;
    const day=(last-prev)/prev*100;
    $("eurPrice").textContent=fmt(last,5);
    setBidAsk("eur",last,0.015,day,5);
    $("eurTrend").textContent=last>prev?"Bullish":last<prev?"Bearish":"Mixed";
    $("eurDate").textContent=ent.at(-1)[0];
    $("eurSignal").textContent="REF";
    $("eurSignal").className="signal ref";
    $("eurReason").textContent="Daily reference rate, not a live forex signal.";
    $("eurStatus").textContent="Frankfurter reference • "+ent.at(-1)[0];
  }catch(e){offline("eur",e);}
}

async function loadJPY(){
  try{
    const end=new Date(),start=new Date(Date.now()-180*86400000);
    const d=v=>v.toISOString().slice(0,10);
    const j=await getJSON(
      "https://api.frankfurter.dev/v1/"+d(start)+".."+d(end)+
      "?base=USD&symbols=JPY"
    );
    const ent=Object.entries(j.rates).sort((a,b)=>a[0].localeCompare(b[0]));
    if(ent.length<2) throw Error("Insufficient reference data");
    const last=+ent.at(-1)[1].JPY,prev=+ent.at(-2)[1].JPY;
    const day=(last-prev)/prev*100;
    $("jpyPrice").textContent=fmt(last,3);
    setBidAsk("jpy",last,0.02,day,3);
    $("jpyTrend").textContent=last>prev?"Bullish":last<prev?"Bearish":"Mixed";
    $("jpyDate").textContent=ent.at(-1)[0];
    $("jpySignal").textContent="REF";
    $("jpySignal").className="signal ref";
    $("jpyReason").textContent="Daily reference rate, not a live forex signal.";
    $("jpyStatus").textContent="Frankfurter reference • "+ent.at(-1)[0];
  }catch(e){offline("jpy",e);}
}

async function loadNAC(){
  try{
    const url="https://query1.finance.yahoo.com/v8/finance/chart/NQ%3DF?range=3mo&interval=1d";
    const p=await getJSON("https://api.allorigins.win/raw?url="+encodeURIComponent(url));
    const result=p.chart?.result?.[0];
    const closes=result?.indicators?.quote?.[0]?.close?.filter(Number.isFinite);
    if(!closes||closes.length<2) throw Error("No valid NASDAQ data");
    const last=closes.at(-1),prev=closes.at(-2),day=(last-prev)/prev*100;
    $("nacPrice").textContent=fmt(last,1);
    setBidAsk("nac",last,0.03,day,1);
    $("nacTrend").textContent=last>prev?"Bullish":last<prev?"Bearish":"Mixed";
    $("nacSignal").textContent="PROXY";
    $("nacSignal").className="signal ref";
    $("nacReason").textContent="NASDAQ futures reference, not Lirunex NACUSD.r.";
    $("nacStatus").textContent="Yahoo NQ=F • Daily data";
  }catch(e){offline("nac",e);}
}

let busy=false;
async function refreshAll(){
  if(busy) return;
  busy=true;
  $("global").textContent="Checking market data...";
  try{
    await Promise.allSettled([
      loadBTC(),loadGold(),loadEUR(),loadJPY(),loadNAC()
    ]);
    $("global").textContent="Data check complete • "+new Date().toLocaleTimeString();
  }finally{
    busy=false;
  }
}

refreshAll();
setInterval(refreshAll,30000);
</script>
